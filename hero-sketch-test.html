<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test — Croquis Hero v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Work+Sans:wght@300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fafaf8;
      font-family: 'Work Sans', sans-serif;
    }

    .hero {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero-sketch {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65%;
      pointer-events: none;
    }

    .sketch-path {
      fill: none;
      stroke: #1a1a1a;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.14;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .hero-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: #1a1a1a;
      margin-bottom: 1rem;
    }

    .hero-subtitle {
      font-size: clamp(0.85rem, 1.8vw, 1.1rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #666666;
    }
  </style>
</head>
<body>

<div class="hero">
  <div class="hero-content">
    <h1 class="hero-name">Jules Manucci Lasnon</h1>
    <p class="hero-subtitle">Architecte D.E.</p>
  </div>

  <!--
    COUPE BIOCLIMATIQUE — trait unique continu
    viewBox : 0 0 900 240  |  sol : y = 218

    Ordre de tracé :
      1. Ligne de terre
      2. Arbre (tronc + couronne en boucle)
      3. Maison en coupe avec débord de toiture (eave)
      4. Ligne de terre → montée vers le soleil
      5. Soleil (cercle)
      6. Trois rayons solaires pointant vers la maison
         (angle été haut → débord / angle mi-saison → façade / angle hiver bas → façade basse)
  -->
  <svg
    class="hero-sketch"
    viewBox="0 0 900 240"
    preserveAspectRatio="xMidYMax meet"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >
    <defs>
      <filter id="crayon" x="-2%" y="-2%" width="104%" height="104%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.042"
          numOctaves="4"
          seed="12"
          result="noise"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="noise"
          scale="1.5"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </defs>

    <path
      class="sketch-path"
      filter="url(#crayon)"
      d="
        M 15,218

        C 42,216 64,219 78,217

        L 79,168
        C 54,155 38,130 50,107
        C 60,89 74,79 91,77
        C 107,79 121,92 127,112
        C 134,132 122,155 106,164
        C 98,169 88,170 79,168
        L 79,217

        C 116,215 165,218 208,217
        L 210,132
        L 184,132
        C 222,113 272,91 338,71
        C 404,91 452,113 490,132
        L 464,132
        L 464,217

        C 512,215 578,217 645,216
        C 675,210 706,185 730,153
        C 750,128 772,98 790,74
        C 795,63 797,55 798,50

        C 798,36 808,26 820,26
        C 832,26 842,36 842,48
        C 842,60 832,70 820,70
        C 808,70 798,60 798,50

        L 628,84   L 798,52
        L 546,134  L 798,52
        L 486,178  L 798,52
      "
    />
  </svg>
</div>

<script>
  const path = document.querySelector('.sketch-path');
  const length = Math.ceil(path.getTotalLength());

  path.style.strokeDasharray = length;
  path.style.strokeDashoffset = length;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      path.style.transition = `stroke-dashoffset 6s cubic-bezier(0.35, 0, 0.15, 1) 0.5s`;
      path.style.strokeDashoffset = '0';
    });
  });
</script>

</body>
</html>
